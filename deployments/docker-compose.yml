name: sds_wallet

services:
  wallet-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 10

  wallet:
    build:
      context: ..
      dockerfile: deployments/wallet.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://wallet:wallet@wallet-db:5432/wallet?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      wallet-db:
        condition: service_healthy

volumes:
  wallet-db-data:
